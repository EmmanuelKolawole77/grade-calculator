<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <nav>
        Nigeria Grading System
    </nav>
    
    <div>
        <h2>Welcome to, University Grading System</h2>
        <p>Check your degree classification based on the 5.0 CGPA scale used in Nigerian Universities.</p>
        <div>University CGPA Checker</div>
    </div>

    <label for="form">Enter your CGPA (e.g., 4.52)</label>
    <input 
    id="gradie"
    type="number"
    placeholder="0.00 - 5.00                 /5.0">
    <button onclick="showGrade()">Show class</button>
    <p id="seeClass">Your grade will show here</p>



    <script src="script.js"></script>
</body>
